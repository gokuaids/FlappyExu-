<script>
'use strict';
/* Física, dificuldade e colisões. Sem DOM e sem alocações por frame. */
const Physics=(()=>{
const C={W:288,H:512,GROUND:420,PW:56,BX:84,BR:13,G:1500,JUMP:-430,MAXV:620,DT:1/120,N:4,SP:172};
const diff=s=>({speed:118+Math.min(s*2.5,62),gap:Math.max(102,130-s*.8)});
const newBird=()=>({y:210,vy:0,rot:0});
const flap=b=>{b.vy=C.JUMP};
function step(b,dt){
  b.vy=Math.min(b.vy+C.G*dt,C.MAXV);
  b.y+=b.vy*dt;
  if(b.y<C.BR){b.y=C.BR;if(b.vy<0)b.vy=0}
  const tg=b.vy<0?-.45:Math.min(b.vy/430,1.4);
  b.rot+=(tg-b.rot)*Math.min(1,dt*(b.vy<0?30:9));
}
function place(p,x,s){
  const d=diff(s),m=44;
  p.x=x;p.gap=p.base=d.gap;p.tx=0;p.passed=false;
  p.y=m+d.gap/2+Math.random()*(C.GROUND-2*m-d.gap);
}
const newPipes=()=>Array.from({length:C.N},()=>({x:0,y:0,gap:0,passed:false,base:0,tx:0}));
function resetPipes(a){for(let i=0;i<a.length;i++)place(a[i],C.W+90+i*C.SP,0)}
function movePipes(a,dt,score){
  const v=diff(score).speed;
  for(let i=0;i<a.length;i++){const p=a[i];p.x-=v*dt;if(p.x<-C.PW)place(p,p.x+C.N*C.SP,score)}
  return v;
}
const cr=(cx,cy,r,rx,ry,rw,rh)=>{
  const dx=cx-Math.max(rx,Math.min(cx,rx+rw)),dy=cy-Math.max(ry,Math.min(cy,ry+rh));
  return dx*dx+dy*dy<r*r;
};
/* 0 = livre, 1 = obstáculo, 2 = chão */
function hit(b,a){
  if(b.y+C.BR>=C.GROUND)return 2;
  const r=C.BR-1;
  for(let i=0;i<a.length;i++){
    const p=a[i];
    if(p.x>C.BX+C.BR||p.x+C.PW<C.BX-C.BR)continue;
    if(cr(C.BX,b.y,r,p.x,-100,C.PW,p.y-p.gap/2+100)||cr(C.BX,b.y,r,p.x,p.y+p.gap/2,C.PW,C.H))return 1;
  }
  return 0;
}
function widen(a,n,amt){const l=a.filter(p=>!p.passed).sort((u,v)=>u.x-v.x).slice(0,n);for(const p of l)p.tx=amt;return l}
function relax(a,dt){const k=Math.min(1,dt*7);for(let i=0;i<a.length;i++){const p=a[i],g=p.base+p.tx;if(p.gap!==g)p.gap+=(g-p.gap)*k}}
function scored(a){
  let n=0;
  for(let i=0;i<a.length;i++){const p=a[i];if(!p.passed&&p.x+C.PW/2<C.BX){p.passed=true;n++}}
  return n;
}
return{C,diff,newBird,flap,step,newPipes,resetPipes,movePipes,hit,scored,widen,relax};
})();
</script>
<script>
'use strict';
/* Áudio sintetizado (Web Audio): efeitos, poderes e música de fundo. Dois volumes: jogo (música + sons) e efeitos especiais (poderes). */
const Sfx=(()=>{
let ctx=null,sfx=null,fxb=null,mus=null,mut=null,lead=null,nb=null,nl=null,timer=0,nxt=0,stp=0;
const V={g:.7,f:.8},_=null,SP=.15,fr=s=>220*Math.pow(2,s/12);
const MEL=[[12,_,7,_,8,_,7,3],[13,_,8,_,10,_,8,5],[12,_,7,8,12,_,15,_],[10,_,7,_,8,7,3,_]],ROOT=[-24,-23,-24,-26];
function ap(){if(!ctx)return;const n=ctx.currentTime;sfx.gain.setTargetAtTime(.35*V.g*V.g,n,.03);fxb.gain.setTargetAtTime(.5*V.f*V.f,n,.03)}
function unlock(){
  if(!ctx){
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A)return;
    ctx=new A();sfx=ctx.createGain();fxb=ctx.createGain();sfx.connect(ctx.destination);fxb.connect(ctx.destination);
    nb=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate);nl=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
    for(const b of[nb,nl]){const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    ap();music();
  }
  if(ctx.state==='suspended')ctx.resume();
}
function tone(type,f0,f1,dur,vol,delay,bus){
  if(!ctx)return;
  const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(bus||sfx);o.start(t);o.stop(t+dur+.02);
}
function noise(vol){
  if(!ctx)return;
  const s=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;
  s.buffer=nb;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
  s.connect(g);g.connect(sfx);s.start(t);
}
/* ruído filtrado com varredura de frequência (sopro, fogo, vento, vidro) */
function nz(kind,f0,f1,dur,vol,delay,q,bus){
  if(!ctx)return;
  const t=ctx.currentTime+(delay||0),s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=nl;s.loop=true;f.type=kind;f.Q.value=q||1;
  f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+Math.min(.08,dur/3));g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(g);g.connect(bus||sfx);s.start(t,Math.random());s.stop(t+dur+.05);
}
/* Música: ritual sombrio em lá frígio — atabaques, baixo, drone e melodia com eco */
function music(){
  mut=ctx.createBiquadFilter();mut.type='lowpass';mut.frequency.value=18000;mut.connect(sfx);
  mus=ctx.createGain();mus.gain.value=.3;mus.connect(mut);
  lead=ctx.createBiquadFilter();lead.type='lowpass';lead.frequency.value=2400;lead.connect(mus);
  const dl=ctx.createDelay(1),fb=ctx.createGain(),wt=ctx.createGain();
  dl.delayTime.value=SP*3;fb.gain.value=.38;wt.gain.value=.45;
  lead.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wt);wt.connect(mus);
  const lp=ctx.createBiquadFilter(),dg=ctx.createGain();lp.type='lowpass';lp.frequency.value=260;dg.gain.value=.07;lp.connect(dg);dg.connect(mus);
  for(const f of[55,55.4,82.4]){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()}
  nxt=ctx.currentTime+.15;timer=setInterval(sched,30);
}
function sched(){if(!ctx)return;while(nxt<ctx.currentTime+.2){step16(stp,Math.max(0,nxt-ctx.currentTime));nxt+=SP;stp=(stp+1)&63}}
function step16(s,d){
  const b=s&15,m=s>>4;
  if(b===0||b===6||b===10)tone('sine',130,45,.2,.7,d,mus);
  if(b===4||b===7||b===12||(m===3&&b===15))tone('triangle',b===12?210:280,b===12?150:200,.12,.4,d,mus);
  nz('highpass',6500,6600,.05,b&1?.1:.05,d,1,mus);
  if(b===0||b===6||b===10||b===14){const f=fr(ROOT[m]+(b===10?7:0));tone('triangle',f,f*.98,.22,.5,d,mus)}
  if(!(b&1)){const n=MEL[m][b>>1];if(n!=null){const f=fr(n);tone('square',f,f,.25,.15,d,lead)}}
}
/* Sons dos poderes (barramento "efeitos especiais") */
const FX={
 phase:()=>{nz('bandpass',250,1400,.5,.6,0,1.2,fxb);nz('bandpass',1400,300,.6,.45,.45,1.2,fxb);tone('sine',110,55,.9,.4,0,fxb);for(let i=0;i<6;i++)nz('highpass',4500,5500,.03,.3,.1+Math.random()*.9,1,fxb)},
 melt:()=>{tone('sawtooth',180,900,.45,.28,0,fxb);nz('bandpass',800,3200,.5,.6,0,.8,fxb);for(let i=0;i<10;i++)nz('highpass',3000,3200,.04,.4,i*.06+Math.random()*.05,1,fxb);[1318,1760,2093].forEach((f,i)=>tone('square',f,f,.1,.14,.15+i*.07,fxb))},
 slow:()=>{tone('sine',520,90,1.3,.5,0,fxb);tone('sine',527,93,1.3,.4,0,fxb);tone('sawtooth',90,45,1.3,.15,0,fxb);nz('lowpass',2500,200,1.3,.5,0,.7,fxb);tone('sine',880,660,1.1,.12,.2,fxb)},
 slowEnd:()=>{tone('sine',110,330,.35,.35,0,fxb);nz('bandpass',300,2000,.3,.3,0,1,fxb)},
 shield:()=>{[1047,1319,1568,2093].forEach((f,i)=>{tone('sine',f,f,.5,.3,i*.07,fxb);tone('triangle',f*2,f*2,.25,.07,i*.07,fxb)});nz('highpass',5000,8000,.4,.15,0,1,fxb)},
 shieldBreak:()=>{nz('highpass',3000,9000,.35,.6,0,1,fxb);[2093,1568,1319,988].forEach((f,i)=>tone('sine',f,f*.8,.35,.28,i*.05,fxb));tone('triangle',300,90,.25,.3,0,fxb)},
 end:()=>tone('sine',500,200,.25,.22,0,fxb),
 ready:()=>{tone('sine',1175,1175,.14,.25,0,fxb);tone('sine',1760,1760,.22,.25,.09,fxb)}
};
return{
  unlock,
  setVol:(g,f)=>{V.g=g;V.f=f;ap()},
  muffle:on=>{if(ctx)mut.frequency.setTargetAtTime(on?500:18000,ctx.currentTime,.12)},
  vis:h=>{if(ctx){if(h)ctx.suspend();else ctx.resume()}},
  fx:n=>{if(ctx&&FX[n])FX[n]()},
  flap:v=>v?tone(v[0],v[1],v[2],.1,v[3]):tone('square',380,680,.09,.45),
  point:()=>{tone('square',880,880,.06,.35);tone('square',1320,1320,.12,.35,.06)},
  hit:()=>{noise(.8);tone('sawtooth',220,50,.25,.5)},
  fase:()=>{tone('square',660,660,.08,.35);tone('square',880,880,.08,.35,.08);tone('square',1320,1320,.18,.35,.16)},
  die:()=>tone('triangle',440,80,.5,.55,.12)
};
})();
</script>
<script>
'use strict';
/* Pixel art: a cena é desenhada em 144x256 (resolução do Flappy Bird original) e ampliada sem suavização. */
const Renderer=(()=>{
const {GROUND,BX}=Physics.C,LW=144,LH=256,LG=GROUND/2;
let cv,x,lo,l,sky,far,mid,gt,glow,waxS,cap,tt,FL;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const R=(c,X,Y,w,h,f)=>{c.fillStyle=f;c.fillRect(X,Y,w,h)};
const disc=(c,cx,cy,r,f)=>{c.fillStyle=f;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r+r*.5)c.fillRect(cx+dx,cy+dy,1,1)};

/* Partículas: rastro, pulo, pontos e morte, com visual próprio de cada personagem */
const PN=160,P=Array.from({length:PN},()=>({a:0,x:0,y:0,vx:0,vy:0,l:0,m:1,c:'#fff',s:1,g:0,w:0}));let pi=0,ta=0;

(()=>{
const $=id=>document.getElementById(id),C=Physics.C,PTS=8,CH=Renderer.CHARS;
const cv=$('cv'),el={score:$('score'),fase:$('fase'),hint:$('hint'),menu:$('menu'),over:$('over'),flash:$('flash'),fs:$('fs'),fb:$('fb'),ff:$('ff'),bm:$('bm'),bf:$('bf'),chars:$('chars'),msg:$('msg'),unl:$('unl'),pwr:$('pwr'),cfg:$('cfg')};
const store={
  get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const bird=Physics.newBird(),pipes=Physics.newPipes();
const view={bird,pipes,scroll:0,t:0,char:'ze',alive:true,st:'menu',pw:{id:'',act:0,dur:1,inv:0,chg:0,rdy:false,ts:1}};
let st='menu',score=0,fase=1,best=+store.get('fbu-best',0)||0,maxF=+store.get('fbu-fase',1)||1,scroll=0,acc=0,last=0,t=0,deadT=0,overShown=false;
const show=(e,on)=>e.classList.toggle('hide',!on);
const faseOf=s=>1+((s/PTS)|0),open=ch=>ch.need<=maxF,cur=()=>CH.find(c=>c.k===view.char);
/* Poderes: cada personagem tem um poder próprio, com som e visual. Recarregam com o tempo. */
const POW={
  ze:{id:'phase',n:'BAFORADA',d:'ATRAVESSA AS VELAS',dur:2.6,cd:15,ic:'💨',c:'#f6f2e8'},
  mirim:{id:'melt',n:'CHAMA VORAZ',d:'ALARGA OS PRÓXIMOS VÃOS',dur:.7,cd:13,ic:'🕯️',c:'#ff6a2a'},
  caveira:{id:'slow',n:'NÉVOA DE ALMAS',d:'TEMPO LENTO',dur:4,cd:18,ic:'👻',c:'#6ab8ff'},
  pg:{id:'shield',n:'ESCUDO DE PÉTALAS',d:'ABSORVE 1 BATIDA',dur:10,cd:20,ic:'🌹',c:'#ff2a48'}
},DEF={id:'shield',n:'ESCUDO SOMBRIO',d:'ABSORVE 1 BATIDA',dur:10,cd:18,ic:'🔥',c:'#f0b441'};
const powOf=()=>POW[view.char]||DEF;

/* Personagem secreto: os dados dele ficam criptografados (AES-GCM, chave via PBKDF2). O código não existe neste arquivo. */
const SEC={"s":"caB5qTZpWUw42SbzV5QbAQ==","i":"xX2dyDzi/WgX6NWd","d":"A6Yxo6x7UYlbgshenAlu8/w66nZtp/5iHFnPxSKe8kPQhAU359i63KYqKAMmyN/oxCwWoQIEHTlSQAAEUUpk5TrArSRLy7gS/iXZwnTlr+vNN2ivowMaYGWm58HoqF+yIDgwFP54861PppqciF5RYkfSW2IRdT906BbyGaisPpd73YX+jjvucL5BT/TlnPdNIRzaJrRLQs8KT3xKtEqkgMNYIa7122I5trKYg4S9a9njs0h95zuIGomPG+GMN5M/povDLO0PiV5A5HsJ2K3aRTpwpfyj9oa4trwPOdox79jQUzi8L+CL/iAWeamjRZIZ3YMgejYLnJ3Jon9Tk7P+HG1WLdgJGHr6SdslinZCC7kpMFquiIo+o44FM66GUTqyg4glyCRgXqLVUHeOLLwmxZlKz/WGPaEKHJJncWP68P3jAtOpxArXnd/ZlfQYxYoYeb221zbCQKHJVpnBhtcQmlx8CGXOs9eq2hu3kUEFEBEIVAG6qBvvkiHbyPBWcHENjj8k4daSv6JaYxUxmnM8Pjg4OLAmbbcg8CwzhqR2W3dCMo988d5vuxlMykqtFB8w+yet8G6BmJMrvldLIjdiy15lZjZw77BUqVkBqv/Bx4GsrvU+p06oBFKMDT7+bCIiuCyEdfP3U9DiYg513MHOX2YHJEeFEpstv1FpLa93agT1rPY+Y4DPwaRvHXiyR1jPnKTmeLGS8vkN9ZCagzF6E1NjOiPwuKQkEzzTZQ==","n":250000};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function reveal(key){
  const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SEC.i)},key,b64(SEC.d));
  const ch=JSON.parse(new TextDecoder().decode(d)),old=CH.find(c=>c.k===ch.k);
  if(old)return old;
  ch.need=0;CH.push(ch);Renderer.buildChar(ch);addCard(ch);refresh();
  if(store.get('fbu-char','ze')===ch.k)choose(ch.k);
  return ch;
}
async function unlock(code){
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SEC.s),iterations:SEC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
  const ch=await reveal(key);
  store.set('fbu-sk',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));
  return ch;
}
async function restore(){
  const s=store.get('fbu-sk','');if(!s||!(window.crypto&&crypto.subtle))return;
  try{await reveal(await crypto.subtle.importKey('raw',b64(s),'AES-GCM',false,['decrypt']))}catch(e){store.set('fbu-sk','')}
}
function refresh(){
  for(const b of el.chars.children){
    const ch=CH.find(c=>c.k===b.dataset.k),u=open(ch);
    b.classList.toggle('lock',!u);b.lastChild.textContent=u?ch.n:'🔒 FASE '+ch.need;
    b.setAttribute('aria-label',u?ch.n:ch.n+', bloqueado: alcance a fase '+ch.need);
  }
  el.bf.textContent=maxF;
}
function choose(k){
  view.char=k;store.set('fbu-char',k);pbtn();el.msg.textContent='PODER: '+powOf().n+' · '+powOf().d;
  for(const b of el.chars.children)b.classList.toggle('on',b.dataset.k===k);
}
function ready(){
  st='ready';score=0;fase=1;overShown=false;view.alive=true;resetPow();
  bird.y=210;bird.vy=0;bird.rot=0;Physics.resetPipes(pipes);
  el.score.textContent=0;el.fase.textContent='FASE 1';
  show(el.menu,false);show(el.over,false);show(el.score,true);show(el.fase,true);show(el.hint,true);show(el.pwr,true);
}
function home(){
  st='menu';overShown=false;view.alive=true;bird.y=210;bird.vy=0;bird.rot=0;
  refresh();el.msg.textContent='ESCOLHA SEU PERSONAGEM';
  show(el.over,false);show(el.score,false);show(el.fase,false);show(el.hint,false);show(el.pwr,false);show(el.menu,true);
}
function flapFx(){const f=cur().fx;Sfx.flap(f.sf);Renderer.burst(C.BX/2-5,bird.y/2+4,4,f.b,30,60,.35)}
function pop(e){e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),90)}
function die(kind){
  st='dead';deadT=0;view.alive=false;
  if(kind===2)bird.y=C.GROUND-C.BR;
  view.pw.act=0;view.pw.inv=0;Sfx.muffle(false);Sfx.hit();Sfx.die();Renderer.burst(C.BX/2,bird.y/2,28,cur().fx.b,80,120,.9);
  if(navigator.vibrate)navigator.vibrate(60);
  fl('#fff',.85);
  if(score>best){best=score;store.set('fbu-best',best)}
  const old=maxF;if(fase>maxF){maxF=fase;store.set('fbu-fase',maxF)}
  const nu=CH.filter(c=>c.need>old&&c.need<=maxF);
  el.unl.textContent=nu.length?'DESBLOQUEOU: '+nu.map(c=>c.n.toUpperCase()).join(' + ')+'!':'';
  if(nu.length)setTimeout(Sfx.fase,700);
  el.fs.textContent=score;el.fb.textContent=best;el.ff.textContent=fase;el.bm.textContent=best;refresh();
}
function pbtn(){const p=powOf();el.pwr.firstChild.textContent=p.ic;el.pwr.style.setProperty('--pc',p.c)}
function resetPow(){Object.assign(view.pw,{id:'',act:0,dur:1,inv:0,chg:.45,rdy:false,ts:1});Sfx.muffle(false);pbtn()}
function fl(c,a){const f=el.flash;f.style.background=c;f.style.setProperty('--fo',a);f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function power(){
  const P=view.pw,pd=powOf();
  if(st!=='play'||!P.rdy||P.act>0)return;
  P.rdy=false;P.chg=0;P.id=pd.id;P.act=P.dur=pd.dur;
  const c=cur().fx.c,bx=C.BX/2,by=bird.y/2;
  Sfx.fx(pd.id);if(navigator.vibrate)navigator.vibrate(25);
  if(pd.id==='phase'){Renderer.burst(bx,by,26,c,38,-4,.9);fl(c[0],.3)}
  else if(pd.id==='melt'){
    for(const p of Physics.widen(pipes,3,34)){const X=p.x/2+14;Renderer.burst(X,(p.y-p.gap/2)/2,10,['#fff6dc','#e6dcc0','#ffd35a'],14,120,.8);Renderer.burst(X,(p.y+p.gap/2)/2,12,c,36,-20,.7)}
    Renderer.burst(bx,by,20,c,60,-10,.6);fl(c[1],.35)
  }
  else if(pd.id==='slow'){Sfx.muffle(true);Renderer.burst(bx,by,24,c,50,-10,1);fl(c[1],.35)}
  else{Renderer.burst(bx,by,20,c,50,30,.7);fl(c[1],.3)}
}
function tickPow(dt){
  const P=view.pw,pd=powOf();
  if(P.inv>0)P.inv-=dt;
  if(P.act>0){P.act-=dt;if(P.act<=0){P.act=0;endPow()}}
  else if(!P.rdy){P.chg+=dt/pd.cd;if(P.chg>=1){P.chg=1;P.rdy=true;Sfx.fx('ready')}}
  P.ts+=((P.id==='slow'&&P.act>0?.5:1)-P.ts)*Math.min(1,dt*8);
}
function endPow(){
  const P=view.pw;
  if(P.id==='slow'){Sfx.muffle(false);Sfx.fx('slowEnd')}
  else if(P.id==='phase'){P.inv=.4;Sfx.fx('end');Renderer.burst(C.BX/2,bird.y/2,14,cur().fx.c,30,-4,.6)}
  else if(P.id==='shield')Sfx.fx('end');
}
function hurt(h){
  const P=view.pw;
  if(h===1&&(P.inv>0||(P.id==='phase'&&P.act>0)))return;
  if(P.id==='shield'&&P.act>0){
    P.act=0;P.inv=1.4;bird.vy=-340;if(h===2)bird.y=C.GROUND-C.BR-4;
    Sfx.fx('shieldBreak');Renderer.burst(C.BX/2,bird.y/2,30,cur().fx.c,70,60,.9);fl(cur().fx.c[0],.5);
    if(navigator.vibrate)navigator.vibrate(30);return;
  }
  die(h);
}
let lastPP=-1;
function pwUI(){const P=view.pw,pp=P.act>0?Math.round(P.act/P.dur*100):P.rdy?100:Math.round(P.chg*100);if(pp!==lastPP){lastPP=pp;el.pwr.style.setProperty('--p',pp)}el.pwr.classList.toggle('rdy',P.rdy&&P.act<=0);el.pwr.classList.toggle('on',P.act>0)}
function act(){
  Sfx.unlock();
  if(st==='menu')ready();
  else if(st==='ready'){st='play';show(el.hint,false);Physics.flap(bird);flapFx()}
  else if(st==='play'){Physics.flap(bird);flapFx()}
  else if(st==='dead'&&deadT>.7)ready();
}
function update(dt){
  t+=dt;
  if(st==='play'){
    tickPow(dt);const dd=dt*view.pw.ts;Physics.step(bird,dd);Physics.relax(pipes,dt);
    scroll+=Physics.movePipes(pipes,dd,score)*dd;
    const n=Physics.scored(pipes);
    if(n){
      score+=n;el.score.textContent=score;Sfx.point();pop(el.score);Renderer.burst(C.BX/2,bird.y/2,7,cur().fx.b,40,40,.5);
      const f=faseOf(score);
      if(f!==fase){fase=f;el.fase.textContent='FASE '+f;Sfx.fase();pop(el.fase);Renderer.burst(C.BX/2,bird.y/2,18,cur().fx.b,60,50,.8)}
    }
    const h=Physics.hit(bird,pipes);
    if(h)hurt(h);
  }else if(st==='dead'){
    deadT+=dt;
    if(bird.y+C.BR<C.GROUND){Physics.step(bird,dt);if(bird.y+C.BR>=C.GROUND)bird.y=C.GROUND-C.BR}
    if(!overShown&&deadT>.5){overShown=true;show(el.over,true);show(el.score,false);show(el.fase,false);show(el.pwr,false)}
  }else{
    bird.y=210+Math.sin(t*5)*6;bird.rot=0;scroll+=60*dt;
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  let d=(ts-last)/1000;last=ts;if(d>.1)d=.1;
  acc+=d;
  while(acc>=C.DT){update(C.DT);acc-=C.DT}
  view.scroll=scroll;view.t=t;view.st=st;
  Renderer.tick(d,view);Renderer.draw(view);pwUI();
}

Renderer.init(cv);
addEventListener('resize',Renderer.resize);
addEventListener('orientationchange',Renderer.resize);
function addCard(ch){
  const b=document.createElement('button'),p=document.createElement('canvas'),s=document.createElement('span');
  b.className='ch';b.dataset.k=ch.k;p.width=16;p.height=14;p.getContext('2d').drawImage(Renderer.sprite(ch.k,1),0,0);
  b.append(p,s);
  b.addEventListener('click',()=>{
    Sfx.unlock();
    if(open(ch))choose(ch.k)
    else{el.msg.textContent='ALCANCE A FASE '+ch.need+' ('+(ch.need-1)*PTS+' PONTOS) PARA LIBERAR';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
    b.blur();
  });
  el.chars.appendChild(b);
  el.chars.classList.toggle('five',el.chars.children.length>4);
}
CH.forEach(addCard);
refresh();
const saved=store.get('fbu-char','ze');
choose(CH.some(c=>c.k===saved&&open(c))?saved:'ze');
el.bm.textContent=best;Physics.resetPipes(pipes);
const go=e=>{Sfx.unlock();e.currentTarget.blur();ready()};
$('play').addEventListener('click',go);$('again').addEventListener('click',go);
$('home').addEventListener('click',e=>{e.currentTarget.blur();home()});
const box=$('codebox'),inp=$('code');
async function submit(){
  if(!inp.value.trim())return;
  Sfx.unlock();const had=CH.length;
  try{
    const ch=await unlock(inp.value);
    inp.value='';show(box,false);choose(ch.k);
    el.msg.textContent=CH.length>had?'SECRETO LIBERADO: '+ch.n.toUpperCase()+'!':'ESSE PERSONAGEM JÁ ESTÁ LIBERADO';
    if(CH.length>had)Sfx.fase();
  }catch(e){el.msg.textContent=e.message==='nocrypto'?'NAVEGADOR SEM SUPORTE':'CÓDIGO INVÁLIDO';inp.select()}
}
$('codebtn').addEventListener('click',e=>{e.currentTarget.blur();const o=box.classList.contains('hide');show(box,o);if(o)inp.focus();else inp.blur()});
$('codeok').addEventListener('click',e=>{e.currentTarget.blur();submit()});
restore();
const cfg=el.cfg,vg=$('vg'),vf=$('vf'),vol={g:Math.min(100,+store.get('fbu-vg',70)),f:Math.min(100,+store.get('fbu-vf',80))};let cfgOpen=false;
function paintVol(){
  for(const [i,v,l] of [[vg,vol.g,'lg'],[vf,vol.f,'lf']]){i.value=v;i.style.setProperty('--v',v+'%');$(l).textContent=v+'%'}
  Sfx.setVol(vol.g/100,vol.f/100);
}
function closeCfg(){cfgOpen=false;show(cfg,false)}
vg.addEventListener('input',()=>{vol.g=+vg.value;paintVol()});
vf.addEventListener('input',()=>{vol.f=+vf.value;paintVol()});
vg.addEventListener('change',()=>{store.set('fbu-vg',vol.g);Sfx.unlock();Sfx.point()});
vf.addEventListener('change',()=>{store.set('fbu-vf',vol.f);Sfx.unlock();Sfx.fx(powOf().id)});
$('cfgbtn').addEventListener('click',e=>{e.currentTarget.blur();Sfx.unlock();cfgOpen=true;show(cfg,true)});
$('cfgok').addEventListener('click',e=>{e.currentTarget.blur();closeCfg()});
paintVol();
el.pwr.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();power()});
el.menu.addEventListener('pointerdown',e=>{if(e.target===el.menu){Sfx.unlock();ready()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();act()});
document.addEventListener('keydown',e=>{
  if(cfgOpen){if(e.code==='Escape')closeCfg();return}
  if(e.target.tagName==='INPUT'){if(e.code==='Enter'||e.code==='NumpadEnter')submit();return}
  if(e.repeat)return;
  if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='ArrowDown'){e.preventDefault();power();return}
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();act()}
});
document.addEventListener('visibilitychange',()=>{last=performance.now();Sfx.vis(document.hidden)});
last=performance.now();requestAnimationFrame(frame);
})();
</script>
