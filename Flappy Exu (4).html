<script>
'use strict';
/* Física, dificuldade e colisões. Sem DOM e sem alocações por frame. */
const Physics=(()=>{
const C={W:288,H:512,GROUND:420,PW:56,BX:84,BR:13,G:1500,JUMP:-430,MAXV:620,DT:1/120,N:4,SP:172};
const diff=s=>({speed:118+Math.min(s*2.5,62),gap:Math.max(102,130-s*.8)});
const newBird=()=>({y:210,vy:0,rot:0});
const flap=b=>{b.vy=C.JUMP};
function step(b,dt){
  b.vy=Math.min(b.vy+C.G*dt,C.MAXV);
  b.y+=b.vy*dt;
  if(b.y<C.BR){b.y=C.BR;if(b.vy<0)b.vy=0}
  const tg=b.vy<0?-.45:Math.min(b.vy/430,1.4);
  b.rot+=(tg-b.rot)*Math.min(1,dt*(b.vy<0?30:9));
}
function place(p,x,s){
  const d=diff(s),m=44;
  p.x=x;p.gap=d.gap;p.passed=false;
  p.y=m+d.gap/2+Math.random()*(C.GROUND-2*m-d.gap);
}
const newPipes=()=>Array.from({length:C.N},()=>({x:0,y:0,gap:0,passed:false}));
function resetPipes(a){for(let i=0;i<a.length;i++)place(a[i],C.W+90+i*C.SP,0)}
function movePipes(a,dt,score){
  const v=diff(score).speed;
  for(let i=0;i<a.length;i++){const p=a[i];p.x-=v*dt;if(p.x<-C.PW)place(p,p.x+C.N*C.SP,score)}
  return v;
}
const cr=(cx,cy,r,rx,ry,rw,rh)=>{
  const dx=cx-Math.max(rx,Math.min(cx,rx+rw)),dy=cy-Math.max(ry,Math.min(cy,ry+rh));
  return dx*dx+dy*dy<r*r;
};
/* 0 = livre, 1 = obstáculo, 2 = chão */
function hit(b,a){
  if(b.y+C.BR>=C.GROUND)return 2;
  const r=C.BR-1;
  for(let i=0;i<a.length;i++){
    const p=a[i];
    if(p.x>C.BX+C.BR||p.x+C.PW<C.BX-C.BR)continue;
    if(cr(C.BX,b.y,r,p.x,-100,C.PW,p.y-p.gap/2+100)||cr(C.BX,b.y,r,p.x,p.y+p.gap/2,C.PW,C.H))return 1;
  }
  return 0;
}
function scored(a){
  let n=0;
  for(let i=0;i<a.length;i++){const p=a[i];if(!p.passed&&p.x+C.PW/2<C.BX){p.passed=true;n++}}
  return n;
}
return{C,diff,newBird,flap,step,newPipes,resetPipes,movePipes,hit,scored};
})();
</script>
<script>
'use strict';
/* Efeitos sonoros sintetizados com Web Audio API (sem arquivos de áudio). */
const Sfx=(()=>{
let ctx=null,out=null,nb=null;
function unlock(){
  if(!ctx){
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A)return;
    ctx=new A();out=ctx.createGain();out.gain.value=.35;out.connect(ctx.destination);
    nb=ctx.createBuffer(1,ctx.sampleRate*.2,ctx.sampleRate);
    const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(ctx.state==='suspended')ctx.resume();
}
function tone(type,f0,f1,dur,vol,delay){
  if(!ctx)return;
  const t=ctx.currentTime+(delay||0),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+.02);
}
function noise(vol){
  if(!ctx)return;
  const s=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime;
  s.buffer=nb;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);
  s.connect(g);g.connect(out);s.start(t);
}
return{
  unlock,
  flap:v=>v?tone(v[0],v[1],v[2],.1,v[3]):tone('square',380,680,.09,.45),
  point:()=>{tone('square',880,880,.06,.35);tone('square',1320,1320,.12,.35,.06)},
  hit:()=>{noise(.8);tone('sawtooth',220,50,.25,.5)},
  fase:()=>{tone('square',660,660,.08,.35);tone('square',880,880,.08,.35,.08);tone('square',1320,1320,.18,.35,.16)},
  die:()=>tone('triangle',440,80,.5,.55,.12)
};
})();
</script>

  for(let y=1;y<=5;y++)for(let X=0;X<LW;X++)R(c,X,y,1,1,((X+y)>>2)&1?'#4f7a2a':'#3a5c20');
  R(c,0,0,LW,1,'#14091c');R(c,0,1,LW,1,'#8fc24a');R(c,0,6,LW,1,'#22340f');
  for(let i=0;i<40;i++)R(c,(i*37)%LW,11+(i*13)%32,2,1,i%2?'#4a301c':'#8a6240');
}
function buildMisc(){
  glow=mk(32,32);const g=glow.getContext('2d'),r=g.createRadialGradient(16,16,1,16,16,16);
  r.addColorStop(0,'rgba(255,170,60,.9)');r.addColorStop(1,'rgba(255,120,30,0)');g.fillStyle=r;g.fillRect(0,0,32,32);
  const wc=i=>i===0||i===27?'#1a0f1c':i<3?'#8e8268':i<6?'#b9ad92':i<9?'#e6dcc0':i<12?'#fff6dc':i<19?'#efe5c8':i<23?'#d6caac':'#a99d82';
  waxS=mk(28,1);for(let i=0;i<28;i++)R(waxS.getContext('2d'),i,0,1,1,wc(i));
  cap=mk(30,6);const k=cap.getContext('2d');
  for(let y=0;y<6;y++)for(let X=0;X<30;X++)R(k,X,y,1,1,(y===0||y===5||X===0||X===29)?'#1a0f1c':y===4?'#8e8268':wc(Math.max(1,Math.min(26,X-1))));
  const FP={o:'#ff8a1e',y:'#ffd35a',w:'#fff3b0'};
  FL=FLR.map(r=>{const c=mk(5,8);paint(c.getContext('2d'),r,FP,0,0);return c});
  CHARS.forEach(buildChar);
}
const FLR=[["..o..",".ooo.",".ooo.","oyyyo","oyyyo","oywyo",".yyy.","..y.."],["...o.","..oo.",".ooo.","oyyyo","oyyyo","oywyo",".yyy.","..y.."]];
const mkGlow=rgb=>{const c=mk(32,32),g=c.getContext('2d'),r=g.createRadialGradient(16,16,1,16,16,16);r.addColorStop(0,'rgba('+rgb+',.9)');r.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=r;g.fillRect(0,0,32,32);return c};
const buildChar=ch=>{
  ch.s=[0,1,2].map(f=>{const c=mk(16,14),g=c.getContext('2d');paint(g,[...ch.h,...BODY],ch.p,0,0);paint(g,WING[f],ch.p,3,WY[f]);return c});
  const f=ch.fx.f;ch.fl=FLR.map(r=>{const c=mk(5,8);paint(c.getContext('2d'),r,{o:f[0],y:f[1],w:f[2]},0,0);return c});ch.gl=mkGlow(ch.fx.g);
};
function resize(){
  const k=Math.min(innerWidth/288,innerHeight/512),d=Math.min(window.devicePixelRatio||1,2),w=288*k,h=512*k,p=cv.parentNode.style;
  p.width=w+'px';p.height=h+'px';cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*d);cv.height=Math.round(h*d);
  document.documentElement.style.setProperty('--k',k);
}
function init(canvas){
  cv=canvas;x=cv.getContext('2d',{alpha:false});
  lo=mk(LW,LH);l=lo.getContext('2d',{alpha:false});l.imageSmoothingEnabled=false;
  buildSky();buildFar();buildMid();buildGround();buildMisc();buildTitle();resize();
}
/* Partículas: rastro, pulo, pontos e morte, com visual próprio de cada personagem */
const PN=110,P=Array.from({length:PN},()=>({a:0,x:0,y:0,vx:0,vy:0,l:0,m:1,c:'#fff',s:1,g:0,w:0}));let pi=0,ta=0;
const rr=(a,b)=>a+Math.random()*(b-a),pk=a=>a[(Math.random()*a.length)|0];
function emit(x,y,vx,vy,life,c,s,g,w){const p=P[pi];pi=(pi+1)%PN;p.a=1;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=life;p.c=c;p.s=s;p.g=g;p.w=w}
function burst(x,y,n,cols,sp,g,life){for(let i=0;i<n;i++){const a=Math.random()*6.2832,v=rr(.4,1)*sp;emit(x,y,Math.cos(a)*v,Math.sin(a)*v-sp*.3,life*rr(.7,1.2),pk(cols),Math.random()<.4?2:1,g,0)}}
function tick(dt,v){
  for(const p of P){if(!p.a)continue;p.l-=dt;if(p.l<=0){p.a=0;continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=(p.vy+(p.w?Math.sin(p.l*14+p.x*.3)*p.w:0))*dt}
  if(v.st==='dead')return;
  ta-=dt;if(ta>0)return;ta=.045;
  const f=CHARS.find(c=>c.k===v.char).fx,x0=v.st==='menu'?64:BX/2-6,y0=v.st==='menu'?124:v.bird.y/2+3,c=f.c;
  switch(f.t){
    case'smoke':emit(x0,y0,rr(-38,-28),rr(-12,-4),.75,pk(c),2,-3,0);break;
    case'ember':emit(x0,y0,rr(-52,-38),rr(-30,-14),.5,pk(c),Math.random()<.5?2:1,-6,0);break;
    case'soul':emit(x0,y0,rr(-40,-30),rr(-8,-2),.85,pk(c),2,0,38);break;
    case'petal':emit(x0,y0-2,rr(-36,-26),rr(0,10),.95,pk(c),2,8,26);break;
    default:emit(x0+rr(-2,2),y0+rr(-3,3),rr(-30,-20),rr(-6,6),.8,pk(c),1,0,0);
  }
}
function drawP(){for(const p of P){if(!p.a)continue;const s=p.l/p.m>.4?p.s:1;R(l,p.x|0,p.y|0,s,s,p.c)}}
const tile=(img,s,y)=>{const o=-(s%LW);l.drawImage(img,o,y);l.drawImage(img,o+LW,y)};
function lit(cx,cy,a,gl){l.globalCompositeOperation='lighter';l.globalAlpha=a;l.drawImage(gl||glow,cx-16,cy-16);l.globalCompositeOperation='source-over';l.globalAlpha=1}
function candle(p,t,ch){
  const X=Math.round(p.x/2),te=Math.round((p.y-p.gap/2)/2),bs=Math.round((p.y+p.gap/2)/2);
  l.drawImage(waxS,0,0,28,1,X,-2,28,te-4);l.drawImage(cap,X-1,te-6);
  R(l,X+7,te,3,4,'#e6dcc0');R(l,X+9,te,1,4,'#b9ad92');R(l,X+19,te,3,6,'#e6dcc0');R(l,X+21,te,1,6,'#b9ad92');
  l.drawImage(cap,X-1,bs);l.drawImage(waxS,0,0,28,1,X,bs+6,28,LG-bs-4);
  R(l,X+13,bs-3,2,3,'#2a1a10');l.drawImage(ch.fl[((t*8+p.y)|0)&1],X+12,bs-11);
  lit(X+14,bs-8,.5+Math.sin(t*9+p.y)*.12,ch.gl);
}
function title(t){
  l.drawImage(tt,0,6+Math.round(Math.sin(t*2.2)*2));
  for(const cx of[6,132]){
    R(l,cx,70,6,24,'#e6dcc0');R(l,cx,70,1,24,'#b9ad92');R(l,cx+5,70,1,24,'#8e8268');R(l,cx+2,68,1,2,'#2a1a10');
    l.drawImage(FL[((t*8+cx)|0)&1],cx,58);lit(cx+3,62,.55);
  }
  [[14,18],[128,12],[22,98],[124,100],[72,2],[40,94]].forEach(([sx,sy],i)=>{
    const ph=(t*2.5+i)%3,s=ph<1?1:ph<2?2:0;
    if(s){R(l,sx-s,sy,2*s+1,1,'#fff6cc');R(l,sx,sy-s,1,2*s+1,'#fff6cc')}
  });
}
function draw(v){
  const ch=CHARS.find(c=>c.k===v.char);
  l.drawImage(sky,0,0);
  ST.forEach(([sx,sy],i)=>{if((((v.t*1.6+i)%3)|0)<2){R(l,sx-1,sy,3,1,'#fff');R(l,sx,sy-1,1,3,'#fff')}});
  tile(far,(v.scroll*.06)|0,LG-75);tile(mid,(v.scroll*.2)|0,LG-55);
  if(v.st!=='menu')for(let i=0;i<v.pipes.length;i++)candle(v.pipes[i],v.t,ch);
  tile(gt,(v.scroll/2)|0,LG);
  drawP();
  const s=ch.s[v.alive?[0,1,2,1][(v.t*12|0)&3]:1];
  if(v.st==='menu')lit(72,122,.35,ch.gl);else if(v.alive)lit(Math.round(BX/2),Math.round(v.bird.y/2),.28,ch.gl);
  l.save();
  if(v.st==='menu'){l.translate(72,122+Math.round(Math.sin(v.t*4)*2));l.scale(2,2)}
  else{l.translate(Math.round(BX/2),Math.round(v.bird.y/2));l.rotate(v.bird.rot)}
  l.drawImage(s,-8,-8);l.restore();
  if(v.st==='menu')title(v.t);
  x.imageSmoothingEnabled=false;x.drawImage(lo,0,0,cv.width,cv.height);
}
return{CHARS,buildChar,tick,burst,init,resize,draw,sprite:(k,f)=>CHARS.find(c=>c.k===k).s[f]};
})();
</script>
<script>
'use strict';
/* Loop principal, estados, progressão (fases / desbloqueios), entrada e interface. */
(()=>{
const $=id=>document.getElementById(id),C=Physics.C,PTS=8,CH=Renderer.CHARS;
const cv=$('cv'),el={score:$('score'),fase:$('fase'),hint:$('hint'),menu:$('menu'),over:$('over'),flash:$('flash'),fs:$('fs'),fb:$('fb'),ff:$('ff'),bm:$('bm'),bf:$('bf'),chars:$('chars'),msg:$('msg'),unl:$('unl')};
const store={
  get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
const bird=Physics.newBird(),pipes=Physics.newPipes();
const view={bird,pipes,scroll:0,t:0,char:'ze',alive:true,st:'menu'};
let st='menu',score=0,fase=1,best=+store.get('fbu-best',0)||0,maxF=+store.get('fbu-fase',1)||1,scroll=0,acc=0,last=0,t=0,deadT=0,overShown=false;
const show=(e,on)=>e.classList.toggle('hide',!on);
const faseOf=s=>1+((s/PTS)|0),open=ch=>ch.need<=maxF,cur=()=>CH.find(c=>c.k===view.char);

/* Personagem secreto: os dados dele ficam criptografados (AES-GCM, chave via PBKDF2). O código não existe neste arquivo. */
const SEC={"s":"caB5qTZpWUw42SbzV5QbAQ==","i":"xX2dyDzi/WgX6NWd","d":"A6Yxo6x7UYlbgshenAlu8/w66nZtp/5iHFnPxSKe8kPQhAU359i63KYqKAMmyN/oxCwWoQIEHTlSQAAEUUpk5TrArSRLy7gS/iXZwnTlr+vNN2ivowMaYGWm58HoqF+yIDgwFP54861PppqciF5RYkfSW2IRdT906BbyGaisPpd73YX+jjvucL5BT/TlnPdNIRzaJrRLQs8KT3xKtEqkgMNYIa7122I5trKYg4S9a9njs0h95zuIGomPG+GMN5M/povDLO0PiV5A5HsJ2K3aRTpwpfyj9oa4trwPOdox79jQUzi8L+CL/iAWeamjRZIZ3YMgejYLnJ3Jon9Tk7P+HG1WLdgJGHr6SdslinZCC7kpMFquiIo+o44FM66GUTqyg4glyCRgXqLVUHeOLLwmxZlKz/WGPaEKHJJncWP68P3jAtOpxArXnd/ZlfQYxYoYeb221zbCQKHJVpnBhtcQmlx8CGXOs9eq2hu3kUEFEBEIVAG6qBvvkiHbyPBWcHENjj8k4daSv6JaYxUxmnM8Pjg4OLAmbbcg8CwzhqR2W3dCMo988d5vuxlMykqtFB8w+yet8G6BmJMrvldLIjdiy15lZjZw77BUqVkBqv/Bx4GsrvU+p06oBFKMDT7+bCIiuCyEdfP3U9DiYg513MHOX2YHJEeFEpstv1FpLa93agT1rPY+Y4DPwaRvHXiyR1jPnKTmeLGS8vkN9ZCagzF6E1NjOiPwuKQkEzzTZQ==","n":250000};
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),norm=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
async function reveal(key){
  const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(SEC.i)},key,b64(SEC.d));
  const ch=JSON.parse(new TextDecoder().decode(d)),old=CH.find(c=>c.k===ch.k);
  if(old)return old;
  ch.need=0;CH.push(ch);Renderer.buildChar(ch);addCard(ch);refresh();
  if(store.get('fbu-char','ze')===ch.k)choose(ch.k);
  return ch;
}
async function unlock(code){
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(code)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SEC.s),iterations:SEC.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},true,['decrypt']);
  const ch=await reveal(key);
  store.set('fbu-sk',btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key)))));
  return ch;
}
async function restore(){
  const s=store.get('fbu-sk','');if(!s||!(window.crypto&&crypto.subtle))return;
  try{await reveal(await crypto.subtle.importKey('raw',b64(s),'AES-GCM',false,['decrypt']))}catch(e){store.set('fbu-sk','')}
}
function refresh(){
  for(const b of el.chars.children){
    const ch=CH.find(c=>c.k===b.dataset.k),u=open(ch);
    b.classList.toggle('lock',!u);b.lastChild.textContent=u?ch.n:'🔒 FASE '+ch.need;
    b.setAttribute('aria-label',u?ch.n:ch.n+', bloqueado: alcance a fase '+ch.need);
  }
  el.bf.textContent=maxF;
}
function choose(k){
  view.char=k;store.set('fbu-char',k);el.msg.textContent='EFEITO: '+cur().fx.d;
  for(const b of el.chars.children)b.classList.toggle('on',b.dataset.k===k);
}
function ready(){
  st='ready';score=0;fase=1;overShown=false;view.alive=true;
  bird.y=210;bird.vy=0;bird.rot=0;Physics.resetPipes(pipes);
  el.score.textContent=0;el.fase.textContent='FASE 1';
  show(el.menu,false);show(el.over,false);show(el.score,true);show(el.fase,true);show(el.hint,true);
}
function home(){
  st='menu';overShown=false;view.alive=true;bird.y=210;bird.vy=0;bird.rot=0;
  refresh();el.msg.textContent='ESCOLHA SEU PERSONAGEM';
  show(el.over,false);show(el.score,false);show(el.fase,false);show(el.hint,false);show(el.menu,true);
}
function flapFx(){const f=cur().fx;Sfx.flap(f.sf);Renderer.burst(C.BX/2-5,bird.y/2+4,4,f.b,30,60,.35)}
function pop(e){e.classList.add('pop');setTimeout(()=>e.classList.remove('pop'),90)}
function die(kind){
  st='dead';deadT=0;view.alive=false;
  if(kind===2)bird.y=C.GROUND-C.BR;
  Sfx.hit();Sfx.die();Renderer.burst(C.BX/2,bird.y/2,28,cur().fx.b,80,120,.9);
  if(navigator.vibrate)navigator.vibrate(60);
  el.flash.classList.remove('on');void el.flash.offsetWidth;el.flash.classList.add('on');
  if(score>best){best=score;store.set('fbu-best',best)}
  const old=maxF;if(fase>maxF){maxF=fase;store.set('fbu-fase',maxF)}
  const nu=CH.filter(c=>c.need>old&&c.need<=maxF);
  el.unl.textContent=nu.length?'DESBLOQUEOU: '+nu.map(c=>c.n.toUpperCase()).join(' + ')+'!':'';
  if(nu.length)setTimeout(Sfx.fase,700);
  el.fs.textContent=score;el.fb.textContent=best;el.ff.textContent=fase;el.bm.textContent=best;refresh();
}
function act(){
  Sfx.unlock();
  if(st==='menu')ready();
  else if(st==='ready'){st='play';show(el.hint,false);Physics.flap(bird);flapFx()}
  else if(st==='play'){Physics.flap(bird);flapFx()}
  else if(st==='dead'&&deadT>.7)ready();
}
function update(dt){
  t+=dt;
  if(st==='play'){
    Physics.step(bird,dt);
    scroll+=Physics.movePipes(pipes,dt,score)*dt;
    const n=Physics.scored(pipes);
    if(n){
      score+=n;el.score.textContent=score;Sfx.point();pop(el.score);Renderer.burst(C.BX/2,bird.y/2,7,cur().fx.b,40,40,.5);
      const f=faseOf(score);
      if(f!==fase){fase=f;el.fase.textContent='FASE '+f;Sfx.fase();pop(el.fase);Renderer.burst(C.BX/2,bird.y/2,18,cur().fx.b,60,50,.8)}
    }
    const h=Physics.hit(bird,pipes);
    if(h)die(h);
  }else if(st==='dead'){
    deadT+=dt;
    if(bird.y+C.BR<C.GROUND){Physics.step(bird,dt);if(bird.y+C.BR>=C.GROUND)bird.y=C.GROUND-C.BR}
    if(!overShown&&deadT>.5){overShown=true;show(el.over,true);show(el.score,false);show(el.fase,false)}
  }else{
    bird.y=210+Math.sin(t*5)*6;bird.rot=0;scroll+=60*dt;
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  let d=(ts-last)/1000;last=ts;if(d>.1)d=.1;
  acc+=d;
  while(acc>=C.DT){update(C.DT);acc-=C.DT}
  view.scroll=scroll;view.t=t;view.st=st;
  Renderer.tick(d,view);Renderer.draw(view);
}

Renderer.init(cv);
addEventListener('resize',Renderer.resize);
addEventListener('orientationchange',Renderer.resize);
function addCard(ch){
  const b=document.createElement('button'),p=document.createElement('canvas'),s=document.createElement('span');
  b.className='ch';b.dataset.k=ch.k;p.width=16;p.height=14;p.getContext('2d').drawImage(Renderer.sprite(ch.k,1),0,0);
  b.append(p,s);
  b.addEventListener('click',()=>{
    Sfx.unlock();
    if(open(ch))choose(ch.k)
    else{el.msg.textContent='ALCANCE A FASE '+ch.need+' ('+(ch.need-1)*PTS+' PONTOS) PARA LIBERAR';b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
    b.blur();
  });
  el.chars.appendChild(b);
  el.chars.classList.toggle('five',el.chars.children.length>4);
}
CH.forEach(addCard);
refresh();
const saved=store.get('fbu-char','ze');
choose(CH.some(c=>c.k===saved&&open(c))?saved:'ze');
el.bm.textContent=best;Physics.resetPipes(pipes);
const go=e=>{Sfx.unlock();e.currentTarget.blur();ready()};
$('play').addEventListener('click',go);$('again').addEventListener('click',go);
$('home').addEventListener('click',e=>{e.currentTarget.blur();home()});
const box=$('codebox'),inp=$('code');
async function submit(){
  if(!inp.value.trim())return;
  Sfx.unlock();const had=CH.length;
  try{
    const ch=await unlock(inp.value);
    inp.value='';show(box,false);choose(ch.k);
    el.msg.textContent=CH.length>had?'SECRETO LIBERADO: '+ch.n.toUpperCase()+'!':'ESSE PERSONAGEM JÁ ESTÁ LIBERADO';
    if(CH.length>had)Sfx.fase();
  }catch(e){el.msg.textContent=e.message==='nocrypto'?'NAVEGADOR SEM SUPORTE':'CÓDIGO INVÁLIDO';inp.select()}
}
$('codebtn').addEventListener('click',e=>{e.currentTarget.blur();const o=box.classList.contains('hide');show(box,o);if(o)inp.focus();else inp.blur()});
$('codeok').addEventListener('click',e=>{e.currentTarget.blur();submit()});
restore();
el.menu.addEventListener('pointerdown',e=>{if(e.target===el.menu){Sfx.unlock();ready()}});
cv.addEventListener('pointerdown',e=>{e.preventDefault();act()});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.code==='Enter'||e.code==='NumpadEnter')submit();return}
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();act()}
});
document.addEventListener('visibilitychange',()=>{last=performance.now()});
last=performance.now();requestAnimationFrame(frame);
})();
</script>
